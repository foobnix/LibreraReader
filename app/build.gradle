// AGP 9 removed applicationVariants: per-ABI version codes and the APK names now come
// from the Variant API, with the same values as before.
androidComponents {
    // The MuPDF-free flavours take libLibreraDocs.so from src/noMupdf/jniLibs and leave
    // libMuPDF.so behind. src/main/jniLibs is part of every variant and is where the MuPDF build
    // writes, so the library is dropped here rather than kept out of the source set.
    onVariants(selector().withFlavor("version", "fdroidJS")) { variant ->
        variant.packaging.jniLibs.excludes.add("**/libMuPDF.so")
    }
    onVariants(selector().withFlavor("version", "proJS")) { variant ->
        variant.packaging.jniLibs.excludes.add("**/libMuPDF.so")
    }

    def abiCodes = ['armeabi-v7a': 0, 'arm64-v8a': 1, 'x86': 2, 'x86_64': 3]
    onVariants(selector().all()) { variant ->
        def flavor = variant.flavorName ? variant.flavorName.capitalize() : ""
        def suffix = mupdfSuffixFor(variant.flavorName)
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType.name() == "ABI" }?.identifier
            if (abi != null) {
                def abiName = abi.replace("arm64-v8a", "arm64").replace("armeabi-v7a", "arm")
                output.versionCode.set(abiCodes.get(abi, 0) + codeNumber)
                output.outputFileName.set("Librera ${flavor}-${versionNumber}${suffix}-${abiName}.apk")
            } else {
                output.versionCode.set(codeNumber)
                output.outputFileName.set("Librera ${flavor}-${versionNumber}${suffix}-uni.apk")
            }
        }
    }
}

tasks.register("copyApks") {
    if (project.hasProperty('beta') || project.hasProperty("release")) {
        println "My Task: [copy apks]"

        // Where the builds go: librera_builds_dir in the global ~/.gradle/gradle.properties
        def buildsDir = project.findProperty("librera_builds_dir")
        if (!buildsDir) {
            throw new GradleException("librera_builds_dir is not set in ~/.gradle/gradle.properties")
        }

        // Every build of this Librera in the destination is replaced. The MuPDF no longer tells
        // two builds apart - they have the same name - so there is nothing to keep back, and a
        // JS build, which never carried the MuPDF marker, is pruned with the rest.
        def own = "*"

        // The betas go into a folder of their own: the folders around it are shared with
        // LibreraX and the other projects
        def betaFolder = "LibreraPro"

        if (project.hasProperty("beta")) {
            delete fileTree("$buildsDir/$betaFolder").include("${own}.apk", "${own}.aab", "${own}-mapping.txt")
        }

        // Second destination of the betas, the folder the testers read: librera_beta_dir in the
        // global ~/.gradle/gradle.properties. Unset, a beta only goes to buildsDir.
        def betaDir = project.hasProperty("beta") ? project.findProperty("librera_beta_dir") : null
        if (betaDir) {
            delete fileTree("$betaDir/$betaFolder").include("${own}.apk", "${own}.aab")
        }

        // Where the releases go: librera_release_dir in the global ~/.gradle/gradle.properties,
        // and only there. buildsDir and librera_beta_dir are the Testing folders the testers
        // read (Google Drive, Dropbox); a release never goes into them.
        def releaseDir = project.hasProperty("release") ? project.findProperty("librera_release_dir") : null
        if (project.hasProperty("release") && !releaseDir) {
            throw new GradleException("librera_release_dir is not set in ~/.gradle/gradle.properties")
        }

        // A version's own folder is emptied only when a release is about to be copied into it
        if (project.hasProperty("release")) {
            delete fileTree("$releaseDir/$versionNumber").include("${own}.apk", "${own}.aab", "${own}-mapping.txt")
        }

        def destinations = []
        if (project.hasProperty("beta")) {
            destinations.add("$buildsDir/$betaFolder")
            if (betaDir) {
                destinations.add("$betaDir/$betaFolder")
            }
        }
        if (project.hasProperty("release")) {
            destinations.add("$releaseDir/$versionNumber")
        }

        // The builds the GitHub release carries, gathered under the version's own folder in a
        // "github" subfolder: one 64-bit APK and one universal of each flavour published there,
        // so the upload is one folder to drag rather than a pick through all of the splits.
        def githubApks = [
                fdroid  : ["*-arm64.apk", "*-uni.apk"],
                fdroidJS: ["*-uni.apk"],
                pro     : ["*-arm64.apk", "*-uni.apk"],
                proJS   : ["*-uni.apk"],
        ]
        if (project.hasProperty("release")) {
            destinations.each { dest ->
                if (dest.endsWith("/$versionNumber")) {
                    delete fileTree("$dest/github").include("*.apk")
                }
            }
        }

        android.productFlavors.each { productFlavor ->
            {
                def flavor = productFlavor.name
                // Both F-Droid flavours carry the F-Droid version; a build of either of them sets
                // versionNumber to it anyway, since the task name holds "Fdroid".
                def appName = "Librera ${flavor.capitalize()}-${flavor.startsWith('fdroid') ? FDroidVersionNumber : versionNumber}${mupdfSuffixFor(flavor)}"

                //println "====  " + variant.buildType.name + " " +  flavor

                destinations.each { dest ->

                    copy {
                        from(file("build/outputs/apk/${flavor}/release/")) {
                            include "*.apk"
                        }
                        // App Bundle: build/outputs/bundle/<flavor>Release/app-<flavor>-release.aab
                        from(file("build/outputs/bundle/${flavor}Release/")) {
                            include "*.aab"
                            rename { "${appName}.aab" }
                        }
                        // R8 mapping for deobfuscating crash stack traces: release folder, Librera and Pro only
                        if (project.hasProperty("release") && dest.endsWith("/$versionNumber") && flavor in ["librera", "pro"]) {
                            from(file("build/outputs/mapping/${flavor}Release/")) {
                                include "mapping.txt"
                                rename { "${appName}-mapping.txt" }
                            }
                        }
                        into file(dest)
                        println "Copy: '" + flavor + "' to " + dest

                        eachFile {
                            project.file(dest).mkdirs()
                            if (!file(dest).exists()) {
                                it.exclude()
                            }
                        }

                    }

                    if (project.hasProperty("release") && githubApks.containsKey(flavor)
                            && dest.endsWith("/$versionNumber") && file(dest).exists()) {
                        copy {
                            from(file("build/outputs/apk/${flavor}/release/")) {
                                githubApks[flavor].each { pattern -> include pattern }
                            }
                            into file("$dest/github")
                        }
                        println "Copy: '" + flavor + "' to " + dest + "/github"
                    }

                }
            }
        }

        // Which MuPDF these builds were made from, as a file beside them: the APKs no longer say
        // it, and the version matters when a crash has to be traced back to a MuPDF. One marker
        // per destination, and the one from the pass before is cleared first, so what is named
        // there is what the builds in that folder actually carry.
        if (mupdfVersion) {
            destinations.each { dest ->
                def folder = project.file(dest)
                if (folder.exists()) {
                    delete fileTree(folder).include("mupdf*.txt")
                    def marker = new File(folder, "mupdf${mupdfVersion}.txt")
                    marker.text = "MuPDF ${mupdfVersion}\nLibrera ${versionNumber} (${codeNumber})\n"
                    println "MuPDF marker: " + marker
                }
            }
        }
    }
}


tasks.register("incVersion") {
    File progejectDir = layout.projectDirectory.getAsFile()
    doLast {
        Properties props = new Properties()
        println "progejectDir :" + progejectDir

        File propsFile = new File(progejectDir, 'gradle.properties')

        propsFile.withInputStream { props.load(it) }

        int appCodeNumber = Integer.parseInt(props.getProperty('appCodeNumber'))
        appCodeNumber += 4

        int appVersionNumberIndex = Integer.parseInt(props.getProperty('appVersionNumberIndex'))
        appVersionNumberIndex += 1

        props.setProperty('appCodeNumber', "" + appCodeNumber)
        props.setProperty('appVersionNumberIndex', "" + appVersionNumberIndex)

        // Closed before the task ends, so the next gradle run reads the whole file.
        propsFile.withWriter { props.store(it, null) }

        println "My Task: [incVersion]"
    }
}

tasks.register("updateFDroid") {
    File projectDir = layout.projectDirectory.getAsFile()
    doLast {
        Properties props = new Properties()
        File propsFile = new File(projectDir, 'gradle.properties')
        propsFile.withInputStream { props.load(it) }

        String code = props.getProperty('appCodeNumber')
        String version = props.getProperty('appVersionNumberBase') + "." + props.getProperty('appVersionNumberIndex')

        // Written into build.gradle itself, so F-Droid's own build of the source carries it.
        File buildFile = new File(projectDir, 'build.gradle')
        String text = buildFile.getText('UTF-8')
                .replaceFirst(/FDroidCodeNumber = \d+/, "FDroidCodeNumber = " + code)
                .replaceFirst(/FDroidVersionNumber = "[^"]*"/, "FDroidVersionNumber = \"" + version + "\"")

        if (!text.contains("FDroidCodeNumber = " + code) || !text.contains("FDroidVersionNumber = \"" + version + "\"")) {
            throw new GradleException("updateFDroid: FDroidCodeNumber/FDroidVersionNumber not found in build.gradle")
        }
        buildFile.setText(text, 'UTF-8')

        println "My Task: [updateFDroid] " + version + " - " + code
    }
}
