ext {
    if (!taskName.contains("Fdroid")) {
        codeNumber = Integer.parseInt(appCodeNumber)
        versionNumber = appVersionNumberBase + "." + appVersionNumberIndex
    } else {
        codeNumber = FDroidCodeNumber
        versionNumber = FDroidVersionNumber
    }

    // The MuPDF the native library was built from, when the build script says (-Pmupdf=1.28.5):
    // it names the marker file written beside the builds.
    mupdfVersion = project.findProperty("mupdf")

    // A build that carries MuPDF says so in its name, as plain "mupdf" - which MuPDF it was built
    // from is written beside the builds instead (mupdf<version>.txt), so a flavour keeps one name
    // whatever it was built against. The JS flavours ship no MuPDF at all and say nothing, the
    // same rule the app itself uses to decide whether MuPDF is there (see Engines.IS_MUPDF).
    mupdfSuffix = "-mupdf"
    mupdfSuffixFor = { String flavorName -> flavorName?.endsWith("JS") ? "" : mupdfSuffix }

    println ""
    println "Version: [" + versionNumber + " - " + codeNumber + "]" + (mupdfVersion ? " MuPDF " + mupdfVersion : "")
}

