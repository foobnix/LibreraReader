name: Pro ARM64 Release

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
        type: string

      dry-run:
        description: Creates a draft release
        required: false
        type: boolean
        default: false

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Pro ARM64-v8a
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git-ref != '' && inputs.git-ref || github.ref }}
          submodules: recursive


      # =========================================================
      # Java
      # =========================================================
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # Android SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # =========================================================
      # Android NDK
      # =========================================================
      - name: Install required Android NDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;30.0.14904198"


      # =========================================================
      # Check NDK
      # =========================================================
      - name: Check NDK
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_HOME/ndk/30.0.14904198"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Required Android NDK was not installed."
            exit 1
          fi

          echo "Using NDK: $NDK"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"


      # =========================================================
      # Release signing
      # =========================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.gradle"
          mkdir -p "$RUNNER_TEMP/signing"

          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > "$RUNNER_TEMP/signing/release.pkcs12"

          if [ ! -s "$RUNNER_TEMP/signing/release.pkcs12" ]; then
            echo "ERROR: Release keystore was not created."
            exit 1
          fi

          cat >> "$HOME/.gradle/gradle.properties" <<EOF
          RELEASE_STORE_FILE=$RUNNER_TEMP/signing/release.pkcs12
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF


      # =========================================================
      # Gradle properties
      # =========================================================
      - name: Configure required Gradle properties
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.gradle"

          cat >> "$HOME/.gradle/gradle.properties" <<EOF
          librera_ndk_dir=$ANDROID_NDK_HOME
          librera_fdroid_ndk_dir=$ANDROID_NDK_HOME

          librera_appGdriveKey=
          librera_admobAppId=
          librera_admobBannerId=
          librera_admobFullId=
          librera_admobRewardId=

          pdf_classic_appGdriveKey=
          pdf_classic_admobAppId=
          pdf_classic_admobBannerId=
          pdf_classic_admobFullId=
          pdf_classic_admobRewardId=

          ebooka_appGdriveKey=
          ebooka_admobAppId=
          ebooka_admobBannerId=
          ebooka_admobFullId=
          ebooka_admobRewardId=

          pdf_v2_appGdriveKey=
          pdf_v2_admobAppId=
          pdf_v2_admobBannerId=
          pdf_v2_admobFullId=
          pdf_v2_admobRewardId=

          epub_reader_appGdriveKey=
          epub_reader_admobAppId=
          epub_reader_admobBannerId=
          epub_reader_admobFullId=
          epub_reader_admobRewardId=

          tts_reader_appGdriveKey=
          tts_reader_admobAppId=
          tts_reader_admobBannerId=
          tts_reader_admobFullId=
          tts_reader_admobRewardId=

          pro_appGdriveKey=${{ secrets.PRO_GDRIVE_CLIENT_ID }}
          pro_appWebClientId=${{ secrets.PRO_WEB_CLIENT_ID }}
          pro_admobAppId=
          pro_admobBannerId=
          pro_admobFullId=
          pro_admobRewardId=
          EOF

          echo "Configured NDK:"
          grep '^librera_ndk_dir=' "$HOME/.gradle/gradle.properties"


      # =========================================================
      # Firebase / Google Services
      # =========================================================
      - name: Create google-services.json
        shell: bash
        run: |
          set -e

          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is empty."
            exit 1
          fi

          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" \
            | base64 --decode \
            > app/google-services.json

          if [ ! -s app/google-services.json ]; then
            echo "ERROR: google-services.json was not created."
            exit 1
          fi


      # =========================================================
      # Restore MuPDF ARM64 cache
      #
      # Cache changes when the MuPDF build script or MuPdfDocument
      # Java source changes.
      # =========================================================
      - name: Restore MuPDF ARM64 cache
        id: mupdf-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libMuPDF.so
            app/src/main/jniLibs/arm64-v8a/liblame.so
          key: mupdf-1.28.3-ndk30-arm64-${{ hashFiles('Builder/link_to_mupdf_1.28.5.sh', 'app/src/main/java/org/ebookdroid/droids/mupdf/**/*.java') }}


      # =========================================================
      # Prepare MuPDF
      # =========================================================
      - name: Prepare MuPDF
        shell: bash
        run: |
          set -e

          LIB_DIR="app/src/main/jniLibs/arm64-v8a"

          if [ -f "$LIB_DIR/libMuPDF.so" ] &&
             [ -f "$LIB_DIR/liblame.so" ]; then

            echo "Cached MuPDF ARM64 libraries found."
            ls -lh "$LIB_DIR"

            exit 0
          fi

          echo "MuPDF cache miss."
          echo "Building MuPDF ARM64..."

          sudo apt-get update

          sudo apt-get install -y \
            mesa-common-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libglu1-mesa-dev \
            libxi-dev \
            pkg-config \
            libgl-dev

          cd Builder

          chmod +x link_to_mupdf_1.28.5.sh

          ./link_to_mupdf_1.28.5.sh


      # =========================================================
      # Save MuPDF ARM64 cache
      #
      # Only save after a successful MuPDF preparation and only
      # when the cache was not already restored.
      # =========================================================
      - name: Save MuPDF ARM64 cache
        if: success() && steps.mupdf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libMuPDF.so
            app/src/main/jniLibs/arm64-v8a/liblame.so
          key: mupdf-1.28.3-ndk30-arm64-${{ hashFiles('Builder/link_to_mupdf_1.28.5.sh', 'app/src/main/java/org/ebookdroid/droids/mupdf/**/*.java') }}


      # =========================================================
      # Verify native libraries
      # =========================================================
      - name: Verify native libraries
        shell: bash
        run: |
          set -e

          JNI_DIR="app/src/main/jniLibs/arm64-v8a"

          test -f "$JNI_DIR/libMuPDF.so" || {
            echo "ERROR: libMuPDF.so missing."
            exit 1
          }

          test -f "$JNI_DIR/liblame.so" || {
            echo "ERROR: liblame.so missing."
            exit 1
          }

          echo "libMuPDF.so:"
          file "$JNI_DIR/libMuPDF.so"

          echo "liblame.so:"
          file "$JNI_DIR/liblame.so"

          file "$JNI_DIR/libMuPDF.so" | grep -qi "ARM aarch64" || {
            echo "ERROR: libMuPDF.so is not ARM64."
            exit 1
          }

          file "$JNI_DIR/liblame.so" | grep -qi "ARM aarch64" || {
            echo "ERROR: liblame.so is not ARM64."
            exit 1
          }

          echo "✓ Native libraries are present and ARM64."


      # =========================================================
      # Build Pro Release
      # =========================================================
      - name: Build Pro Release
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -PsplitByAbi=arm64-v8a \
            assembleProRelease


      # =========================================================
      # Prepare APK artifact
      # =========================================================
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/pro/release"

          echo "Available APKs:"
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print

          APK_PATH=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK was generated in $APK_DIR"
            find app/build/outputs/apk -type f -name '*.apk' -print
            exit 1
          fi

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            -printf '%f\n' | sort -V | tail -n 1)

          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"

          if [ ! -x "$AAPT" ]; then
            echo "ERROR: aapt not found: $AAPT"
            exit 1
          fi

          VERSION=$("$AAPT" dump badging "$APK_PATH" \
            | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" \
            | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read versionName from APK manifest."
            exit 1
          fi

          mkdir -p artifacts
          OUTPUT="artifacts/Librera-Pro-${VERSION}-ARM64.apk"
          cp "$APK_PATH" "$OUTPUT"

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_PATH=$OUTPUT" >> "$GITHUB_ENV"

          echo "Prepared APK: $OUTPUT"
          ls -lh "$OUTPUT"


      # =========================================================
      # Verify APK signature
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK does not exist:"
            echo "$APK_PATH"
            exit 1
          fi

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" \
            | sort -V \
            | tail -1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"


      # =========================================================
      # Verify ARM64-only APK
      # =========================================================
      - name: Verify ARM64-v8a only
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          echo "APK:"
          echo "$APK"

          echo
          echo "Detected ABI(s):"

          ABIS=$(
            unzip -Z1 "$APK" \
              | sed -nE 's#^lib/([^/]+)/.*#\1#p' \
              | sort -u
          )

          echo "$ABIS"

          if ! echo "$ABIS" | grep -qx "arm64-v8a"; then
            echo "ERROR: arm64-v8a missing."
            exit 1
          fi

          if echo "$ABIS" | grep -Eq \
            '^(armeabi-v7a|x86|x86_64|mips|mips64)$'; then
            echo "ERROR: Non-ARM64 ABI detected."
            exit 1
          fi

          CHECK_DIR="$RUNNER_TEMP/apk-check"

          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"

          unzip -q "$APK" -d "$CHECK_DIR"

          SO_COUNT=0

          while IFS= read -r -d '' SO; do
            SO_COUNT=$((SO_COUNT + 1))

            echo
            echo "Checking:"
            echo "$SO"

            file "$SO"

            file "$SO" | grep -qi "ARM aarch64" || {
              echo "ERROR: Non-ARM64 ELF detected."
              exit 1
            }

          done < <(
            find "$CHECK_DIR/lib/arm64-v8a" \
              -type f \
              -name "*.so" \
              -print0
          )

          if [ "$SO_COUNT" -eq 0 ]; then
            echo "ERROR: No native libraries found."
            exit 1
          fi

          test -f "$CHECK_DIR/lib/arm64-v8a/libMuPDF.so" || {
            echo "ERROR: libMuPDF.so missing from APK."
            exit 1
          }

          test -f "$CHECK_DIR/lib/arm64-v8a/liblame.so" || {
            echo "ERROR: liblame.so missing from APK."
            exit 1
          }

          echo
          echo "✓ ARM64-v8a only"
          echo "✓ All native ELF files are ARM64"
          echo "✓ libMuPDF.so present"
          echo "✓ liblame.so present"


      # =========================================================
      # APK information
      # =========================================================
      - name: APK information
        shell: bash
        run: |
          set -e

          echo "APK:"
          ls -lh "$APK_PATH"

          echo
          echo "Version:"
          echo "$APP_VERSION"

          echo
          echo "SHA-256:"
          sha256sum "$APK_PATH"


      # =========================================================
      # Upload GitHub Actions artifact
      # =========================================================
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: Librera-Pro-${{ env.APP_VERSION }}-ARM64
          path: artifacts/*.apk
          if-no-files-found: error


      # =========================================================
      # Create draft GitHub Release
      # =========================================================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Librera Pro ARM64 ${{ env.APP_VERSION }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: ${{ env.APK_PATH }}
